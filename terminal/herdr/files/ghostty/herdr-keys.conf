# herdr 키 바인딩 — kitty.conf 의 send_key 매핑을 Ghostty 로 옮긴 것.
#
# kitty 에는 send_key 가 있어 협상된 키보드 프로토콜에 맞춰 자동 인코딩하지만
# Ghostty 에는 없다. 그래서 Kitty 키보드 프로토콜의 CSI u 시퀀스를 직접 적는다.
#   형식: CSI <유니코드> ; <수정자> u
#   수정자 = 1 + shift(1) + alt(2) + ctrl(4)
#   ctrl+alt = 7,  ctrl+alt+shift = 8
#
# 이 파일은 활성 설정에서 config-file 로 포함시켜야 동작한다.
# 키 이름은 Ghostty 기본 바인딩과 동일한 표기를 쓴다 (1..9, [, ] — one/bracket_left 아님).
# 숫자는 논리(1)와 물리(digit_1) 양쪽을 모두 건다. Ghostty 기본값도 그렇게 한다.

# ── 탭 ────────────────────────────────────────────────
keybind = cmd+t=csi:99;7u
keybind = cmd+[=csi:91;7u
keybind = cmd+]=csi:93;7u
keybind = cmd+n=csi:114;7u

keybind = cmd+1=csi:49;7u
keybind = cmd+digit_1=csi:49;7u
keybind = cmd+2=csi:50;7u
keybind = cmd+digit_2=csi:50;7u
keybind = cmd+3=csi:51;7u
keybind = cmd+digit_3=csi:51;7u
keybind = cmd+4=csi:52;7u
keybind = cmd+digit_4=csi:52;7u
keybind = cmd+5=csi:53;7u
keybind = cmd+digit_5=csi:53;7u
keybind = cmd+6=csi:54;7u
keybind = cmd+digit_6=csi:54;7u
keybind = cmd+7=csi:55;7u
keybind = cmd+digit_7=csi:55;7u
keybind = cmd+8=csi:56;7u
keybind = cmd+digit_8=csi:56;7u
keybind = cmd+9=csi:57;7u
keybind = cmd+digit_9=csi:57;7u

# ── space ─────────────────────────────────────────────
keybind = cmd+shift+t=csi:110;8u
keybind = cmd+shift+[=csi:98;8u
keybind = cmd+shift+]=csi:102;8u
keybind = cmd+shift+n=csi:114;8u
keybind = cmd+shift+w=csi:119;8u

keybind = alt+1=csi:49;8u
keybind = alt+digit_1=csi:49;8u
keybind = alt+2=csi:50;8u
keybind = alt+digit_2=csi:50;8u
keybind = alt+3=csi:51;8u
keybind = alt+digit_3=csi:51;8u
keybind = alt+4=csi:52;8u
keybind = alt+digit_4=csi:52;8u
keybind = alt+5=csi:53;8u
keybind = alt+digit_5=csi:53;8u
keybind = alt+6=csi:54;8u
keybind = alt+digit_6=csi:54;8u
keybind = alt+7=csi:55;8u
keybind = alt+digit_7=csi:55;8u
keybind = alt+8=csi:56;8u
keybind = alt+digit_8=csi:56;8u
keybind = alt+9=csi:57;8u
keybind = alt+digit_9=csi:57;8u

# ── pane ──────────────────────────────────────────────
# 주의: cmd+d / cmd+shift+d / cmd+방향키 는 Ghostty 자체 split 을 덮어쓴다.
keybind = cmd+d=csi:100;8u
keybind = cmd+shift+d=csi:100;7u
keybind = cmd+enter=csi:122;7u
keybind = cmd+shift+enter=csi:122;7u

keybind = cmd+arrow_left=csi:104;7u
keybind = cmd+arrow_down=csi:106;7u
keybind = cmd+arrow_up=csi:107;7u
keybind = cmd+arrow_right=csi:108;7u

keybind = cmd+shift+arrow_left=csi:1;8D
keybind = cmd+shift+arrow_down=csi:1;8B
keybind = cmd+shift+arrow_up=csi:1;8A
keybind = cmd+shift+arrow_right=csi:1;8C

# pane 위치 바꾸기 — option+wasd 로 현재 pane 을 이웃과 맞바꾼다.
# w/a/s/d 를 herdr 의 방향 chord k/h/j/l 로 옮긴다 (위/왼쪽/아래/오른쪽).
# 받는 쪽은 config.toml 의 [[keys.command]] 4개 (ctrl+alt+shift+hjkl).
# kitty.conf 에는 대응 매핑이 없으므로 이 기능은 Ghostty 전용이다.
# 대가: Ghostty 안에서 option+w/a/s/d 로 치던 문자 ∑ å ß ∂ 는 입력되지 않는다.
keybind = alt+w=csi:107;8u
keybind = alt+a=csi:104;8u
keybind = alt+s=csi:106;8u
keybind = alt+d=csi:108;8u

# ── 그 외 ─────────────────────────────────────────────
keybind = cmd+b=csi:98;7u
keybind = cmd+e=csi:101;7u
keybind = cmd+o=csi:111;7u
keybind = cmd+shift+o=csi:111;8u

# ── prefix 를 앞세워야 하는 것들 ───────────────────────
# kitty 의 combine 에 해당. Ghostty 는 액션 연결이 없어 text: 로 두 시퀀스를 한 번에 보낸다.
# \x1b[113;5u = ctrl+q (herdr prefix)
keybind = cmd+w=text:\x1b[113;5u\x1b[120;3u
